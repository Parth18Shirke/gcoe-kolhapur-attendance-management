components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          description: e.g. 2026-2027
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
      - updated_at
    AcademicYearRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: e.g. 2026-2027
          maxLength: 50
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
      required:
      - end_date
      - name
      - start_date
    ActionTypeEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - FINALIZE
      - CORRECT
      - APPROVE_CORRECTION
      - REJECT_CORRECTION
      - CANCEL_SESSION
      - RESCHEDULE_SESSION
      - SYNC_ATTENDANCE
      type: string
      description: |-
        * `CREATE` - Create Record
        * `UPDATE` - Update Record
        * `DELETE` - Delete / Archive Record
        * `FINALIZE` - Finalize Attendance Session
        * `CORRECT` - Direct Attendance Correction
        * `APPROVE_CORRECTION` - Approve Correction Request
        * `REJECT_CORRECTION` - Reject Correction Request
        * `CANCEL_SESSION` - Cancel Lecture Session
        * `RESCHEDULE_SESSION` - Reschedule Lecture Session
        * `SYNC_ATTENDANCE` - Offline Ingestion Sync
    AdminStudent:
      type: object
      description: Full administrative serializer exposing university PRN and full
        profile.
      properties:
        id:
          type: integer
          readOnly: true
        classroom_display:
          type: string
          readOnly: true
        division_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        prn:
          type: string
          description: Full University Permanent Registration Number (e.g. 23060361241234)
          maxLength: 64
        roll_number:
          type: string
          description: Class Roll No (e.g. IT-01)
          maxLength: 30
        full_name:
          type: string
          maxLength: 200
        official_email:
          type: string
          format: email
          maxLength: 254
        status:
          $ref: '#/components/schemas/AdminStudentStatusEnum'
        division:
          type: integer
      required:
      - classroom_display
      - created_at
      - division
      - division_name
      - full_name
      - id
      - official_email
      - prn
      - roll_number
      - updated_at
    AdminStudentRequest:
      type: object
      description: Full administrative serializer exposing university PRN and full
        profile.
      properties:
        prn:
          type: string
          minLength: 1
          description: Full University Permanent Registration Number (e.g. 23060361241234)
          maxLength: 64
        roll_number:
          type: string
          minLength: 1
          description: Class Roll No (e.g. IT-01)
          maxLength: 30
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        official_email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        status:
          $ref: '#/components/schemas/AdminStudentStatusEnum'
        division:
          type: integer
      required:
      - division
      - full_name
      - official_email
      - prn
      - roll_number
    AdminStudentStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
        * `ARCHIVED` - Archived / Graduated
    AttendanceCalculation:
      type: object
      properties:
        student_id:
          type: integer
        roll_number:
          type: string
        classroom_display:
          type: string
        full_name:
          type: string
        total_conducted:
          type: integer
        total_attended:
          type: integer
        total_absent:
          type: integer
        overall_percentage:
          type: number
          format: double
        theory_conducted:
          type: integer
        theory_attended:
          type: integer
        theory_percentage:
          type: number
          format: double
        lab_conducted:
          type: integer
        lab_attended:
          type: integer
        lab_percentage:
          type: number
          format: double
        is_deficient:
          type: boolean
        statutory_threshold:
          type: number
          format: double
      required:
      - classroom_display
      - full_name
      - is_deficient
      - lab_attended
      - lab_conducted
      - lab_percentage
      - overall_percentage
      - roll_number
      - statutory_threshold
      - student_id
      - theory_attended
      - theory_conducted
      - theory_percentage
      - total_absent
      - total_attended
      - total_conducted
    AttendanceRecordItemRequest:
      type: object
      properties:
        student_id:
          type: integer
        status:
          $ref: '#/components/schemas/StatusCecEnum'
      required:
      - status
      - student_id
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        actor_email:
          type: string
          readOnly: true
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        entity_name:
          type: string
          maxLength: 100
        entity_id:
          type: string
          maxLength: 64
        old_values: {}
        new_values: {}
        reason:
          type: string
        client_ip:
          type: string
          maxLength: 45
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action_type
      - actor_email
      - actor_name
      - created_at
      - entity_id
      - entity_name
      - id
    CancelSessionRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
      - reason
    CorrectionRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        requested_by_name:
          type: string
          readOnly: true
        reviewed_by_name:
          type: string
          readOnly: true
        student_display:
          type: string
          readOnly: true
        student_roll:
          type: string
          readOnly: true
        session_info:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        original_status:
          type: string
          maxLength: 20
        new_status:
          type: string
          maxLength: 20
        reason:
          type: string
          description: Mandatory institutional justification for modifying an academic
            record
        status:
          $ref: '#/components/schemas/CorrectionStatusEnum'
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        review_remarks:
          type: string
        attendance_record:
          type: integer
        requested_by:
          type: integer
        reviewed_by:
          type: integer
          nullable: true
      required:
      - attendance_record
      - created_at
      - id
      - new_status
      - original_status
      - reason
      - requested_by
      - requested_by_name
      - reviewed_by_name
      - session_info
      - student_display
      - student_roll
      - updated_at
    CorrectionStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - AUTO_APPLIED
      type: string
      description: |-
        * `PENDING` - Pending HOD Approval
        * `APPROVED` - Approved & Applied
        * `REJECTED` - Rejected
        * `AUTO_APPLIED` - Auto-Applied (24h Faculty Window)
    DayOfWeekEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
